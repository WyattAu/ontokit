[package]
name = "ontokit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Wyatt Au <wyatt_au@protonmail.com>"]
repository = "https://github.com/WyattAu/ontokit"
description = "Entity ontology with provenance for the argus intelligence platform"

[dependencies]
feedkit = "0.1.0"
graphkit = "0.1.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
